# For the alembic CLI (e.g. `uv run alembic revision -m "..."`). The app runs migrations
# programmatically via jargonator.db.session.run_migrations.
[alembic]
script_location = src/jargonator/db/migrations
sqlalchemy.url = sqlite:///data/jargonator.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
